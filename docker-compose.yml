services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      API_URL: http://api:4000
    depends_on:
      - api

  api:
    build: ./backend
    ports:
      - "4000:4000"
    environment:
      GRAPHDB_ENDPOINT: http://host.docker.internal:7200/repositories/GraphAfghanica

  caddy:
    image: caddy:latest
    ports:
      - "8080:80"
    volumes:
      - ./images:/srv/images:ro
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
